<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password — San Vicente Choir</title>
        <link rel="icon" href="../SVC_Logo.ico" />
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="SVC">
    <link rel="apple-touch-icon" href="/assets/images/officers/SVC_Logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/design-system.css">
    <style>
      .auth-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--space-6);
        background: var(--black);
      }
      .auth-card {
        width: 100%;
        max-width: 420px;
        background: var(--charcoal);
        border: 1px solid var(--gold-dim);
        padding: 40px 36px;
      }
      .auth-logo {
        display: block;
        height: 52px;
        margin: 0 auto var(--space-4);
      }
      .auth-title {
        font-family: var(--font-display);
        font-size: 1.05rem;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ivory);
        text-align: center;
        margin-bottom: 4px;
      }
      .auth-sub {
        font-family: var(--font-text);
        font-style: italic;
        color: var(--ivory-dim);
        font-size: 0.875rem;
        text-align: center;
        margin-bottom: var(--space-8);
      }
      .auth-back {
        display: block;
        text-align: center;
        margin-top: var(--space-3);
        font-size: var(--text-sm);
        color: var(--ivory-muted);
        text-decoration: none;
      }
      .auth-back:hover { color: var(--ivory-dim); }
    </style>
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <div id="page-loader" class="page-loader" aria-hidden="true">
      <img src="../assets/images/officers/SVC_Logo.png" alt="" class="page-loader-logo">
      <div class="spinner"></div>
    </div>

    <div class="auth-page">
      <main id="main-content" class="auth-card">
        <img src="../assets/images/officers/SVC_Logo.png" alt="San Vicente Choir" class="auth-logo">
        <h1 class="auth-title">Forgot Password</h1>
        <p class="auth-sub">Enter your email and we'll send you a reset link</p>

        <div id="error-msg" class="alert alert-error" role="alert" style="display:none">
          <span class="alert-icon">⚠</span>
          <span id="error-text"></span>
        </div>
        <div id="success-msg" class="alert alert-success" role="status" style="display:none">
          <span class="alert-icon">✓</span>
          <span id="success-text"></span>
        </div>

        <form id="forgot-form" novalidate>
          <div class="form-group">
            <label for="email">Email Address <span class="required">*</span></label>
            <input type="email" id="email" name="email" required
                   autocomplete="email" placeholder="your@email.com">
          </div>
          <button type="submit" id="submit-btn" class="btn btn-gold" style="width:100%;margin-top:8px">
            Send Reset Link
          </button>
        </form>

        <a href="login.html" class="auth-back">← Back to Sign In</a>
      </main>
    </div>

    <script type="module">
      import { sendPasswordResetEmail } from '../js/auth.js';
      import { hidePageLoader } from '../js/utils.js';

      hidePageLoader();

      const form       = document.getElementById('forgot-form');
      const errorMsg   = document.getElementById('error-msg');
      const errorText  = document.getElementById('error-text');
      const successMsg = document.getElementById('success-msg');
      const successTxt = document.getElementById('success-text');
      const submitBtn  = document.getElementById('submit-btn');

      const resetUrl = `${window.location.origin}/pages/reset-password.html`;

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorMsg.style.display   = 'none';
        successMsg.style.display = 'none';
        submitBtn.disabled = true;
        submitBtn.textContent = 'Sending…';

        try {
          await sendPasswordResetEmail(form.email.value.trim(), resetUrl);
          successTxt.textContent = 'Reset link sent! Check your email inbox (and spam folder).';
          successMsg.style.display = 'flex';
          form.reset();
        } catch (err) {
          errorText.textContent = err.message || 'Failed to send reset email. Please try again.';
          errorMsg.style.display = 'flex';
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Send Reset Link';
        }
      });
    </script>
  </body>
</html>
