<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In — San Vicente Choir</title>
    <link rel="icon" href="../SVC_Logo.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/design-system.css">
    <style>
      .auth-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--space-6);
        background: var(--black);
      }
      .auth-card {
        width: 100%;
        max-width: 420px;
        background: var(--charcoal);
        border: 1px solid var(--gold-dim);
        padding: 40px 36px;
      }
      .auth-logo {
        display: block;
        height: 52px;
        margin: 0 auto var(--space-4);
      }
      .auth-title {
        font-family: var(--font-display);
        font-size: 1.05rem;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ivory);
        text-align: center;
        margin-bottom: 4px;
      }
      .auth-sub {
        font-family: var(--font-text);
        font-style: italic;
        color: var(--ivory-dim);
        font-size: 0.875rem;
        text-align: center;
        margin-bottom: var(--space-8);
      }
      .auth-footer {
        text-align: center;
        margin-top: var(--space-5);
        font-size: var(--text-sm);
        color: var(--ivory-dim);
      }
      .auth-footer a { color: var(--gold); }
      .auth-back {
        display: block;
        text-align: center;
        margin-top: var(--space-3);
        font-size: var(--text-sm);
        color: var(--ivory-muted);
        text-decoration: none;
      }
      .auth-back:hover { color: var(--ivory-dim); }
    </style>
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <div id="page-loader" class="page-loader" aria-hidden="true">
      <img src="../assets/images/officers/SVC_Logo.png" alt="" class="page-loader-logo">
      <div class="spinner"></div>
    </div>

    <div class="auth-page">
      <main id="main-content" class="auth-card">
        <img src="../assets/images/officers/SVC_Logo.png" alt="San Vicente Choir" class="auth-logo">
        <h1 class="auth-title">Sign In</h1>
        <p class="auth-sub">San Vicente Choir Portal</p>

        <div id="inactive-msg" class="alert alert-error" role="alert" style="display:none">
          <span class="alert-icon">⚠</span>
          Your account has been deactivated. Please contact an officer if you think this is a mistake.
        </div>
        <div id="error-msg" class="alert alert-error" role="alert" style="display:none">
          <span class="alert-icon">⚠</span>
          <span id="error-text"></span>
        </div>
        <div id="success-msg" class="alert alert-success" role="status" style="display:none">
          <span class="alert-icon">✓</span>
          Password updated successfully. Please sign in with your new password.
        </div>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="email">Email Address <span class="required">*</span></label>
            <input type="email" id="email" name="email" required
                   autocomplete="email" placeholder="your@email.com">
          </div>
          <div class="form-group">
            <label for="password">Password <span class="required">*</span></label>
            <div class="password-wrapper">
              <input type="password" id="password" name="password" required
                     autocomplete="current-password">
              <button type="button" class="password-toggle" aria-label="Show password" data-target="password">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <div style="text-align:right;margin-top:4px">
              <a href="forgot-password.html" style="font-size:var(--text-sm);color:var(--gold)">Forgot password?</a>
            </div>
          </div>
          <button type="submit" id="submit-btn" class="btn btn-gold" style="width:100%;margin-top:8px">
            Sign In
          </button>
        </form>

        <p class="auth-footer">
          Not a member? <a href="register.html">Register here</a>
        </p>
        <a href="../index.html" class="auth-back">← Back to main site</a>
      </main>
    </div>

    <script type="module">
      import { signIn, getSession } from '../js/auth.js';

      document.querySelectorAll('.password-toggle').forEach(btn => {
        btn.addEventListener('click', () => {
          const input = document.getElementById(btn.dataset.target);
          const showing = input.type === 'text';
          input.type = showing ? 'password' : 'text';
          btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
          btn.innerHTML = showing
            ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`
            : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
        });
      });
      import { hidePageLoader } from '../js/utils.js';

      const _params = new URLSearchParams(window.location.search);
      if (_params.get('reset') === '1') {
        document.getElementById('success-msg').style.display = 'flex';
      }
      if (_params.get('inactive') === '1') {
        document.getElementById('inactive-msg').style.display = 'flex';
      }

      // Already logged in → redirect; otherwise reveal the form
      const _session = await getSession();
      if (_session) {
        window.location.href = _params.get('next') || 'members/dashboard.html';
      } else {
        hidePageLoader();
      }

      const form      = document.getElementById('login-form');
      const errorMsg  = document.getElementById('error-msg');
      const errorText = document.getElementById('error-text');
      const submitBtn = document.getElementById('submit-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorMsg.style.display = 'none';
        submitBtn.disabled = true;
        submitBtn.textContent = 'Signing in…';

        try {
          await signIn(form.email.value.trim(), form.password.value);
          const params = new URLSearchParams(window.location.search);
          window.location.href = params.get('next') || 'members/dashboard.html';
        } catch (err) {
          errorText.textContent = err.message || 'Sign in failed. Please check your credentials.';
          errorMsg.style.display = 'flex';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In';
        }
      });
    </script>
  </body>
</html>
