<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password — San Vicente Choir</title>
        <link rel="icon" href="../SVC_Logo.ico" />
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="SVC">
    <link rel="apple-touch-icon" href="/assets/images/officers/SVC_Logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/design-system.css">
    <style>
      .auth-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--space-6);
        background: var(--black);
      }
      .auth-card {
        width: 100%;
        max-width: 420px;
        background: var(--charcoal);
        border: 1px solid var(--gold-dim);
        padding: 40px 36px;
      }
      .auth-logo {
        display: block;
        height: 52px;
        margin: 0 auto var(--space-4);
      }
      .auth-title {
        font-family: var(--font-display);
        font-size: 1.05rem;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ivory);
        text-align: center;
        margin-bottom: 4px;
      }
      .auth-sub {
        font-family: var(--font-text);
        font-style: italic;
        color: var(--ivory-dim);
        font-size: 0.875rem;
        text-align: center;
        margin-bottom: var(--space-8);
      }
      .auth-back {
        display: block;
        text-align: center;
        margin-top: var(--space-3);
        font-size: var(--text-sm);
        color: var(--ivory-muted);
        text-decoration: none;
      }
      .auth-back:hover { color: var(--ivory-dim); }
      #invalid-link { text-align: center; padding: var(--space-4) 0; }
      #invalid-link p { color: var(--ivory-dim); margin-bottom: var(--space-4); }
    </style>
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <div id="page-loader" class="page-loader" aria-hidden="true">
      <img src="../assets/images/officers/SVC_Logo.png" alt="" class="page-loader-logo">
      <div class="spinner"></div>
    </div>

    <div class="auth-page">
      <main id="main-content" class="auth-card">
        <img src="../assets/images/officers/SVC_Logo.png" alt="San Vicente Choir" class="auth-logo">
        <h1 class="auth-title">Reset Password</h1>
        <p class="auth-sub">Choose a new password for your account</p>

        <div id="error-msg" class="alert alert-error" role="alert" style="display:none">
          <span class="alert-icon">⚠</span>
          <span id="error-text"></span>
        </div>

        <!-- Shown while waiting for Supabase to verify the token -->
        <div id="loading-state" style="text-align:center;color:var(--ivory-dim);padding:var(--space-4) 0">
          Verifying link…
        </div>

        <!-- Shown if the token is invalid or expired -->
        <div id="invalid-link" style="display:none">
          <p>This reset link is invalid or has expired.</p>
          <a href="forgot-password.html" class="btn btn-gold" style="display:inline-block">Request a new link</a>
        </div>

        <!-- Shown once the recovery session is confirmed -->
        <form id="reset-form" novalidate style="display:none">
          <div class="form-group">
            <label for="password">New Password <span class="required">*</span></label>
            <div class="password-wrapper">
              <input type="password" id="password" name="password" required
                     autocomplete="new-password" minlength="8">
              <button type="button" class="password-toggle" aria-label="Show password" data-target="password">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <small style="color:var(--ivory-muted);font-size:0.78rem">At least 8 characters</small>
          </div>
          <div class="form-group">
            <label for="confirm">Confirm Password <span class="required">*</span></label>
            <div class="password-wrapper">
              <input type="password" id="confirm" name="confirm" required
                     autocomplete="new-password">
              <button type="button" class="password-toggle" aria-label="Show password" data-target="confirm">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <button type="submit" id="submit-btn" class="btn btn-gold" style="width:100%;margin-top:8px">
            Set New Password
          </button>
        </form>

        <a href="login.html" class="auth-back">← Back to Sign In</a>
      </main>
    </div>

    <script type="module">
      import { supabase } from '../js/supabase-client.js';

      document.querySelectorAll('.password-toggle').forEach(btn => {
        btn.addEventListener('click', () => {
          const input = document.getElementById(btn.dataset.target);
          const showing = input.type === 'text';
          input.type = showing ? 'password' : 'text';
          btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
          btn.innerHTML = showing
            ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`
            : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
        });
      });
      import { updatePassword } from '../js/auth.js';
      import { hidePageLoader } from '../js/utils.js';

      hidePageLoader();

      const loadingState = document.getElementById('loading-state');
      const invalidLink  = document.getElementById('invalid-link');
      const resetForm    = document.getElementById('reset-form');
      const errorMsg     = document.getElementById('error-msg');
      const errorText    = document.getElementById('error-text');
      const submitBtn    = document.getElementById('submit-btn');

      // Supabase reads the #access_token hash and fires PASSWORD_RECOVERY
      const { data: { subscription } } = supabase.auth.onAuthStateChange(async (event, session) => {
        if (event === 'PASSWORD_RECOVERY') {
          loadingState.style.display = 'none';
          resetForm.style.display = 'block';
        } else if (event === 'SIGNED_IN' && !session) {
          showInvalid();
        }
      });

      // Fallback: if no event fires within 4 seconds, show invalid-link state
      const fallback = setTimeout(() => {
        if (loadingState.style.display !== 'none') showInvalid();
      }, 4000);

      function showInvalid() {
        clearTimeout(fallback);
        loadingState.style.display = 'none';
        invalidLink.style.display  = 'block';
      }

      resetForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorMsg.style.display = 'none';

        const pwd     = document.getElementById('password').value;
        const confirm = document.getElementById('confirm').value;

        if (pwd.length < 8) {
          errorText.textContent = 'Password must be at least 8 characters.';
          errorMsg.style.display = 'flex';
          return;
        }
        if (pwd !== confirm) {
          errorText.textContent = 'Passwords do not match.';
          errorMsg.style.display = 'flex';
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Saving…';

        try {
          await updatePassword(pwd);
          subscription.unsubscribe();
          // Sign out so user lands on a clean login page
          await supabase.auth.signOut();
          window.location.href = 'login.html?reset=1';
        } catch (err) {
          errorText.textContent = err.message || 'Failed to update password. Please try again.';
          errorMsg.style.display = 'flex';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Set New Password';
        }
      });
    </script>
  </body>
</html>
